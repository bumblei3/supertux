name: Android
on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - master
      - android-workflows
    tags:
      - '*'
  pull_request: {2485}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-latest
    env:
      # SUPERTUX_VERSION is set later using git describe.
      SDL_TAG: 3.4.12
      B_T_VERSION: 35.0.0
      NDK_VERSION: 29.0.14206865
      SDK_VERSION: 35
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole tree so git describe works
          fetch-depth: 0
          submodules: recursive

      - name: Prepare SUPERTUX_VERSION
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "SUPERTUX_VERSION=$tag" >> $GITHUB_ENV
          echo "SUPERTUX_VERSION: $tag"

      - name: Use cached dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg
          # Bump the suffix when the installed package set or the way we
          # invoke vcpkg changes, so a stale cache (e.g. one created while
          # VCPKG_TRIPLET was empty and 'vcpkg install' aborted before
          # populating vcpkg/installed/) is not reused.
          key: android-${{ matrix.arch }}-vcpkg-installed-v3-${{ hashFiles('.github/workflows/android.yml') }}

      - name: Bootstrap custom vcpkg
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          cd vcpkg
          ./bootstrap-vcpkg.sh

      # Set the vcpkg triplet for the current matrix arch. Must run
      # unconditionally (NOT inside the cache-guarded bootstrap step) so
      # VCPKG_TRIPLET is defined even when the vcpkg cache is reused;
      # otherwise `--triplet=` is empty and vcpkg errors with
      # "Invalid triplet:". Exported to $GITHUB_ENV so the Build/Install
      # steps both see it.
      - name: Set vcpkg triplet
        run: |
          case "${{ matrix.arch }}" in
            arm64-v8a) echo "VCPKG_TRIPLET=arm64-android" >> $GITHUB_ENV
                       echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV ;;
            armeabi-v7a) echo "VCPKG_TRIPLET=arm-neon-android" >> $GITHUB_ENV
                         echo "ANDROID_ABI=armeabi-v7a" >> $GITHUB_ENV ;;
            x86) echo "VCPKG_TRIPLET=x86-android" >> $GITHUB_ENV
                 echo "ANDROID_ABI=x86" >> $GITHUB_ENV ;;
            x86_64) echo "VCPKG_TRIPLET=x64-android" >> $GITHUB_ENV
                    echo "ANDROID_ABI=x86_64" >> $GITHUB_ENV ;;
          esac

      - name: Install dependencies
        run: |
          cd vcpkg
          # Manifest mode (reads vcpkg.json at repo root): generates the
          # per-triplet toolchain file vcpkg/<triplet>.cmake that the Build
          # step passes to -DCMAKE_TOOLCHAIN_FILE. Classic mode
          # (--classic) does NOT emit that file, so the build fails with
          # "Could not find toolchain file: vcpkg/<triplet>.cmake".
          # In manifest mode the package set comes from vcpkg.json, so no
          # packages are listed on the command line.
          ./vcpkg install --triplet=$VCPKG_TRIPLET

      - name: Build
        run: |
          # Use the STANDARD vcpkg toolchain as PRIMARY (it wires up
          # find_package / CMAKE_PREFIX_PATH to vcpkg_installed/) and
          # CHAINLOAD the Android NDK toolchain via
          # VCPKG_CHAINLOAD_TOOLCHAIN_FILE (correct spelling + direction:
          # the NDK supplies the cross-compiler, vcpkg supplies package
          # discovery). Passing ONLY the vcpkg toolchain left the host
          # compiler ("/usr/bin/cc") -> link failed against arm64
          # libSDL3_ttf.a ("Relocations in generic ELF"). Passing ONLY the
          # NDK toolchain lost vcpkg package discovery ("libpng not
          # found").
          # ANDROID_ABI (set per-arch above) selects the target arch.
          # GITHUB_JOBS is NOT set anywhere in this workflow; a bare -j
          # would spawn unlimited parallel cc1plus processes and OOM the
          # 7 GB runner (observed: "Killed signal terminated program
          # cc1plus"). Cap at 2 -- Android NDK cross-compiles are heavy.
          JOBS=2
          # GitHub runners preinstall NDKs under $ANDROID_HOME/ndk/<ver>
          # (there is no ndk-bundle); pick the newest by version sort.
          NDK_CMAKE=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)
          echo "Using NDK toolchain: $NDK_CMAKE"
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$NDK_CMAKE/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ANDROID_ABI \
            -DANDROID_PLATFORM=android-$SDK_VERSION \
            -DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET \
            -DSUPERTUX_JOBS=$JOBS \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target supertux2 -j$JOBS

      - name: Prepare SDL Android project
        run: |
          # Bootstraps mk/android from SDL ${SDL_TAG}'s android-project
          # (gradlew, wrapper jar, Java activity). Without it there is no
          # way to package an APK -- the CPack 'package' target only
          # produces tarballs.
          ./tools/bootstrap-android-project.sh ${SDL_TAG}

          echo "vcpkg_root=$VCPKG_ROOT" > mk/android/local.properties
          echo "ndk_home=$NDK_CMAKE" >> mk/android/local.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Build APK
        working-directory: mk/android/
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -Pcpuarch="${{ matrix.arch }}"

      - name: Rename APK
        run: |
          mv mk/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            mk/android/app/build/outputs/apk/release/SuperTux-${SUPERTUX_VERSION}-${{ matrix.arch }}-unsigned.apk

      - name: Sign APK
        working-directory: mk/android/app/build/outputs/apk/release
        run: |
          # CI fallback key (no secrets on the fork).
          if [ ! -f supertux.keystore ]
          then
            keytool -genkey -v \
              -keystore supertux.keystore \
              -alias supertux \
              -storepass hunter2 \
              -dname "cn=SuperTux CI, O=SuperTux, L=Antarctica, ST=Antarctica, C=aq" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          cp ./SuperTux-${SUPERTUX_VERSION}-${{ matrix.arch }}-unsigned.apk ./SuperTux-${SUPERTUX_VERSION}-${{ matrix.arch }}.apk

          $ANDROID_SDK_ROOT/build-tools/${B_T_VERSION}/apksigner sign \
            --ks supertux.keystore \
            --ks-key-alias supertux \
            --ks-pass pass:hunter2 \
            ./SuperTux-${SUPERTUX_VERSION}-${{ matrix.arch }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supertux2-${{ matrix.arch }}.apk
          path: "mk/android/app/build/outputs/apk/release/SuperTux-${{ env.SUPERTUX_VERSION }}-${{ matrix.arch }}.apk"
          if-no-files-found: error
